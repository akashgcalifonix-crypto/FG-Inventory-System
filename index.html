<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated System (Final Stable)</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --primary: #0f172a; --secondary: #334155; --accent: #0d6efd; --success: #10b981; --danger: #ef4444; }
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; padding-bottom: 80px; font-size: 1.35rem; } 
        .hidden { display: none !important; }
        .loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); z-index:9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .main-header { background: var(--primary); padding: 15px 30px; color: white; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-main .nav-link { color: rgba(255,255,255,0.9); font-weight: 700; margin-right: 20px; cursor: pointer; font-size: 1.4rem; } 
        .nav-main .nav-link.active { background-color: var(--accent); color: white !important; }
        .container-fluid { max-width: 100% !important; padding-left: 40px; padding-right: 40px; } 
        .card { border: none; border-radius: 12px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .form-label { font-weight: 700; font-size: 1.3rem; color: #444; }
        .form-control, .form-select { font-size: 1.3rem; padding: 12px; border-radius: 8px; } 
        .btn { font-size: 1.3rem; padding: 12px 25px; font-weight: 700; border-radius: 8px; } 
        .table th { background-color: #343a40; color: white; vertical-align: middle; font-size: 1.35rem; padding: 15px; }
        .table td { font-size: 1.35rem; vertical-align: middle; padding: 12px; }
        .app-logo { height: 65px; background: white; padding: 5px; border-radius: 6px; }
        .btn-excel { background-color: #198754; color: white; border: none; } .btn-excel:hover { background-color: #157347; color: white; }
        .btn-action { font-size: 1.4rem; padding: 5px 12px; margin: 0 2px; cursor: pointer; }
        .sub-nav .nav-link { font-size: 1.3rem; padding: 15px 30px; border: 2px solid #e0e0e0; background: white; margin-right: 10px; border-radius: 40px; font-weight: 600; }
        .sub-nav .nav-link.active { background-color: var(--secondary); color: white; border-color: var(--secondary); }
        .floor-badge { font-size: 1.1rem; padding: 6px 12px; border-radius: 6px; color: white; font-weight: bold; }
        .bg-f1 { background-color: #28a745; } .bg-f2 { background-color: #ffc107; color: black; } .bg-base { background-color: #dc3545; }
        .filter-group { display: flex; align-items: center; gap: 15px; background: #fff; padding: 12px; border: 2px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

<div id="global-loader" class="loading-overlay">
    <div class="spinner-border text-primary" style="width: 6rem; height: 6rem;"></div>
    <h2 id="loader-text" class="mt-4 fw-bold text-secondary">Updating Sheet...</h2>
</div>

<!-- HEADER -->
<div class="main-header d-flex justify-content-between align-items-center sticky-top">
    <div class="d-flex align-items-center gap-4">
        <img src="https://i.postimg.cc/5y7SN4xc/logo.png" class="app-logo" alt="Logo">
        <h2 class="m-0 fw-bold d-none d-md-block">Inventory & PDI Master</h2>
    </div>
    <ul class="nav nav-pills nav-main">
        <li class="nav-item"><a class="nav-link active" onclick="switchMainTab('prod')">Production</a></li>
        <li class="nav-item"><a class="nav-link" onclick="switchMainTab('pdi-master')">PDI Master</a></li>
        <li class="nav-item"><a class="nav-link" onclick="switchMainTab('disp')">Dispatch</a></li>
        <li class="nav-item"><a class="nav-link" onclick="switchMainTab('open')">Opening</a></li>
        <li class="nav-item"><a class="nav-link" onclick="switchMainTab('dash')">Reports</a></li>
    </ul>
</div>

<div class="container-fluid">

    <!-- 1. PRODUCTION TAB -->
    <div id="view-prod" class="main-view">
        <div class="card p-4">
            <h3 class="text-secondary fw-bold border-bottom pb-3 mb-4">Production Entry</h3>
            <form id="form-prod">
                <input type="hidden" id="editIdx-prod" value="">
                <div class="row g-4">
                    <div class="col-md-2"><label class="form-label">Date</label><input type="date" name="date" id="prod-date" class="form-control" required></div>
                    <div class="col-md-2"><label class="form-label">Line</label><input type="number" name="line" id="prod-line" class="form-control" oninput="checkFloor(this, 'bdg-p')" required><span id="bdg-p" class="floor-badge hidden"></span></div>
                    <div class="col-md-3"><label class="form-label">Model</label><select name="model" id="prod-m" class="form-select" onchange="filterC('prod')" required></select></div>
                    <div class="col-md-3"><label class="form-label">Color</label><select name="color" id="prod-c" class="form-select" onchange="fillP('prod')" required></select></div>
                    <div class="col-md-2"><label class="form-label">FG Qty</label><input type="number" name="fgQty" id="prod-qty" class="form-control" required></div>
                    <div class="col-12"><label class="text-muted fs-5">Part Code:</label><input type="text" name="partCode" id="prod-p" class="form-control bg-light" readonly></div>
                </div>
                <div class="d-flex gap-3 mt-5">
                    <button type="button" class="btn btn-warning w-100 py-3" id="btnAddProd" onclick="addQueue('prod')">+ Add to Queue</button>
                    <button type="button" class="btn btn-secondary w-100 hidden py-3" id="btnCancelProd" onclick="cancelEdit('prod')">Cancel Edit</button>
                </div>
            </form>
            <div class="mt-5"><table class="table table-bordered mb-2"><tbody id="queue-prod"></tbody></table><button class="btn btn-primary w-100 py-3" id="btnSaveProd" onclick="submitQueue('prod', 'Production')">Save Queue to Sheet</button></div>
        </div>
        <div class="card p-4">
            <h4 class="fw-bold text-primary mb-4">Production Data (Recent)</h4>
            <div class="filter-group mb-4">
                <span class="fw-bold">From:</span> <input type="date" id="filter-prod-from" class="form-control w-auto" onchange="renderDBTable('prod')">
                <span class="fw-bold">To:</span> <input type="date" id="filter-prod-to" class="form-control w-auto" onchange="renderDBTable('prod')">
            </div>
            <div class="table-responsive"><table class="table table-bordered text-center table-hover" id="tbl-prod-db"><thead class="table-light"><tr><th>Date</th><th>Line</th><th>Model</th><th>Color</th><th>Part</th><th>Qty</th><th>Actions</th></tr></thead><tbody id="db-prod"></tbody></table></div>
        </div>
    </div>

    <!-- PDI MASTER TAB -->
    <div id="view-pdi-master" class="main-view hidden">
        <div class="card p-4">
            <h3 class="text-secondary fw-bold border-bottom pb-3 mb-4">PDI Entry</h3>
            <form id="form-pdi">
                <input type="hidden" id="pdiEditIndex" value="">
                <div class="row g-4">
                    <div class="col-md-2"><label class="form-label">Date</label><input type="date" name="date" id="pdi-date" class="form-control" required></div>
                    <div class="col-md-1"><label class="form-label">Line</label><input type="number" name="line" id="pdi-line" class="form-control" required></div>
                    <div class="col-md-2"><label class="form-label">Model</label><select name="model" id="pdi-m" class="form-select" onchange="filterC('pdi')" required></select></div>
                    <div class="col-md-2"><label class="form-label">Color</label><select name="color" id="pdi-c" class="form-select" onchange="fillP('pdi')" required></select></div>
                    <div class="col-md-2"><label class="form-label">Lot ID</label><input type="text" name="lotId" id="pdi-lot" class="form-control"></div>
                    <div class="col-md-3"><label class="form-label">Type</label><select name="lotType" id="pdi-type" class="form-select"><option>Fresh</option><option>Rework</option><option>Warranty</option><option>Old FG</option><option>Market Return</option></select></div>
                    <div class="col-md-1"><label class="form-label">Offer</label><input type="number" id="off" name="pdiOffer" class="form-control" oninput="calcP()" required></div>
                    <div class="col-md-1"><label class="form-label">Pass</label><input type="number" id="pas" name="pdiPass" class="form-control" oninput="calcP()" required></div>
                    <div class="col-md-9"><label class="form-label">Defect Reason</label><input type="text" name="defectReason" id="pdi-rsn" class="form-control"></div>
                </div>
                <div class="d-flex gap-3 mt-5">
                    <button type="button" class="btn btn-warning w-100 py-3" id="btnAddPdi" onclick="addPdiQueue()">+ Add Pending</button>
                    <button type="button" class="btn btn-secondary w-100 hidden py-3" id="btnCancelPdi" onclick="cancelPdiEdit()">Cancel Edit</button>
                </div>
            </form>
            <div class="mt-5"><table class="table table-bordered mb-2"><tbody id="queue-pdi"></tbody></table><button class="btn btn-primary w-100 py-3" onclick="submitPdiQueue()">Save All Pending</button></div>
        </div>
        <div class="card p-4">
            <h4 class="fw-bold text-success mb-4">PDI Records</h4>
            <div class="table-responsive"><table class="table table-bordered text-center table-hover" id="tbl-pdi-db"><thead class="table-light"><tr><th>Date</th><th>Line</th><th>Model</th><th>Color</th><th>Lot ID</th><th>Type</th><th>Pass/Offer</th><th>Fail</th><th>Defect</th><th>Actions</th></tr></thead><tbody id="crudTable"></tbody></table></div>
        </div>
    </div>

</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwsK1ct-deLcSgzpj-NSBQnbIytft2Bdv_ec22J-tBr-cBvDrC5YMStZ21cUWhQ_WG78Q/exec";
    const INV_URL = WEB_APP_URL;
    
    let masterData=[], queueData={prod:[],pdi:[]}, dbData={prod:[],pdi:[]};

    window.onload = function() {
        let today = new Date().toLocaleDateString('en-CA');
        ['prod-date', 'pdi-date', 'filter-prod-from', 'filter-prod-to'].forEach(id=>{ if(document.getElementById(id)) document.getElementById(id).value=today; });
        
        toggleLoader(true);
        fetch(INV_URL + "?action=getMasters").then(r=>r.json()).then(d=>{
            masterData = d; populateModels(['prod','pdi']);
            return fetch(INV_URL + "?action=getDashboard");
        }).then(r=>r.json()).then(d=>{
            dbData.prod=d.prod||[];
            renderDBTable('prod');
            return fetch(INV_URL + "?action=getPdi"); // Assuming you have an action to get PDI data
        }).then(r=>r.json()).then(d=>{
            dbData.pdi = d.data || [];
            renderRecentTable(); 
            toggleLoader(false);
        }).catch(e=>{ toggleLoader(false); alert("Error Loading Data"); });
    };

    // --- MAIN EDIT & DELETE FUNCTIONS FOR GOOGLE SHEET ---

    function editDB(tab, idx) {
        if (!dbData[tab] || !dbData[tab][idx]) return;
        let r = dbData[tab][idx];
        
        // Target index for Sheet (Array index + 2)
        document.getElementById('editIdx-' + tab).value = idx + 2;
        
        if (tab === 'prod') {
            document.getElementById('prod-date').value = getCleanDate(r[0]);
            document.getElementById('prod-line').value = r[1];
            checkFloor(document.getElementById('prod-line'), 'bdg-p');
            document.getElementById('prod-m').value = r[3];
            filterC('prod');
            document.getElementById('prod-c').value = r[4];
            document.getElementById('prod-p').value = r[5];
            document.getElementById('prod-qty').value = r[6];
            
            document.getElementById('btnAddProd').innerText = "Update Record in Sheet";
            document.getElementById('btnAddProd').classList.replace('btn-warning', 'btn-primary');
            document.getElementById('btnCancelProd').classList.remove('hidden');
        }
        window.scrollTo(0,0);
    }

    function submitEdit(tab) {
        let form = document.getElementById('form-' + tab);
        let rowIndex = document.getElementById('editIdx-' + tab).value;
        let fd = new FormData(form);
        let type = (tab === 'prod' ? 'Production' : (tab === 'disp' ? 'Dispatch' : 'Opening'));
        
        let dataArray = [];
        if (tab === 'prod') {
            let ln = parseInt(fd.get('line'));
            let floor = (ln <= 8 ? "1st Floor" : (ln <= 16 ? "2nd Floor" : "Basement"));
            dataArray = [fd.get('date'), ln, floor, fd.get('model'), fd.get('color'), fd.get('partCode'), fd.get('fgQty')];
        }

        toggleLoader(true);
        fetch(INV_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: {'Content-Type': 'text/plain;charset=utf-8'},
            body: JSON.stringify({
                action: 'edit',
                type: type,
                rowIndex: parseInt(rowIndex),
                data: dataArray
            })
        })
        .then(r => r.json())
        .then(res => {
            alert("Sheet Updated Successfully!");
            location.reload(); 
        })
        .catch(e => { toggleLoader(false); alert("Error updating Sheet"); });
    }

    function delDB(tab, idx) {
        if (!confirm("Are you sure you want to delete this row from Google Sheet?")) return;
        
        let type = (tab === 'prod' ? 'Production' : 'PDI');
        let rowIndex = idx + 2; 

        toggleLoader(true);
        fetch(INV_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: {'Content-Type': 'text/plain;charset=utf-8'},
            body: JSON.stringify({
                action: 'delete',
                type: type,
                rowIndex: rowIndex
            })
        })
        .then(r => r.json())
        .then(res => {
            alert("Row Deleted from Sheet!");
            location.reload();
        })
        .catch(e => { toggleLoader(false); alert("Error deleting row"); });
    }

    // --- HELPER FUNCTIONS ---
    function toggleLoader(s){ document.getElementById('global-loader').style.display = s?'flex':'none'; }
    
    function addQueue(tab) {
        if(document.getElementById('editIdx-' + tab).value !== "") {
            submitEdit(tab);
            return;
        }
        let form = document.getElementById('form-' + tab);
        if(!form.checkValidity()) { form.reportValidity(); return; }
        let fd = Object.fromEntries(new FormData(form));
        queueData[tab].push(fd);
        renderQueue(tab);
        form.reset();
    }

    function renderQueue(tab) {
        let tb = document.getElementById('queue-' + tab); tb.innerHTML = "";
        queueData[tab].forEach((r, i) => {
            tb.innerHTML += `<tr><td>${r.date}</td><td>${r.model}</td><td>${r.fgQty}</td><td><button class="btn btn-sm btn-danger" onclick="queueData['${tab}'].splice(${i},1);renderQueue('${tab}')">X</button></td></tr>`;
        });
    }

    function submitQueue(tab, type) {
        if(!queueData[tab].length) return;
        toggleLoader(true);
        let rows = queueData[tab].map(r => [r.date, r.line, (r.line<=8?"1st Floor":(r.line<=16?"2nd Floor":"Basement")), r.model, r.color, r.partCode, r.fgQty]);
        fetch(INV_URL, {
            method: 'POST',
            redirect: 'follow',
            headers: {'Content-Type': 'text/plain;charset=utf-8'},
            body: JSON.stringify({ action: 'save', type: type, data: rows })
        }).then(r => r.json()).then(d => { alert("Data Saved to Sheet!"); location.reload(); });
    }

    function renderDBTable(tab) {
        let tb = document.getElementById('db-' + tab); tb.innerHTML = "";
        let from = document.getElementById('filter-prod-from').value;
        let to = document.getElementById('filter-prod-to').value;
        dbData[tab].forEach((r, i) => {
            let d = getCleanDate(r[0]);
            if(d >= from && d <= to) {
                tb.innerHTML += `<tr><td>${fmtDate(r[0])}</td><td>${r[1]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>
                    <button class="btn btn-sm btn-link p-0" onclick="editDB('${tab}',${i})"><i class="bi bi-pencil-square"></i></button>
                    <button class="btn btn-sm btn-link text-danger p-0" onclick="delDB('${tab}',${i})"><i class="bi bi-trash"></i></button>
                </td></tr>`;
            }
        });
    }

    function populateModels(ids){ 
        let m=[...new Set(masterData.map(r=>r[1]))].sort(); 
        ids.forEach(x=>{ 
            let s=document.getElementById(x+'-m'); 
            s.innerHTML='<option value="">Select</option>'; 
            m.forEach(v=>s.innerHTML+=`<option value="${v}">${v}</option>`) 
        }); 
    }

    function filterC(p){ 
        let m=document.getElementById(p+'-m').value, s=document.getElementById(p+'-c'); 
        s.innerHTML='<option value="">Select</option>'; 
        [...new Set(masterData.filter(r=>r[1]==m).map(r=>r[2]))].sort().forEach(c=>s.innerHTML+=`<option value="${c}">${c}</option>`); 
    }

    function fillP(p){ 
        let m=document.getElementById(p+'-m').value, c=document.getElementById(p+'-c').value, f=masterData.find(r=>r[1]==m&&r[2]==c); 
        if(f)document.getElementById(p+'-p').value=f[0]; 
    }

    function checkFloor(i,id){ 
        let v=parseInt(i.value),e=document.getElementById(id); 
        e.className="floor-badge"; 
        if(v>=1&&v<=8){e.innerText="1st";e.classList.add("bg-f1");e.classList.remove("hidden");}
        else if(v>=9&&v<=16){e.innerText="2nd";e.classList.add("bg-f2");e.classList.remove("hidden");}
        else if(v>=17&&v<=24){e.innerText="Base";e.classList.add("bg-base");e.classList.remove("hidden");}
        else e.classList.add("hidden"); 
    }

    function getCleanDate(iso){ if(!iso) return ""; let d = new Date(iso); return d.toISOString().split('T')[0]; }
    function fmtDate(iso){ if(!iso)return ""; let d=new Date(iso); return d.getDate().toString().padStart(2,'0')+'/'+(d.getMonth()+1).toString().padStart(2,'0'); }
    function switchMainTab(id) { document.querySelectorAll('.main-view').forEach(e=>e.classList.add('hidden')); document.getElementById('view-'+id).classList.remove('hidden'); }
    function cancelEdit(tab) { location.reload(); }

</script>
</body>
</html>
